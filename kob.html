    // ================= 碰撞 =================
    // 销毁一块砖（直接击碎或爆炸波及共用）
    function killBrick(brick, hx, hy) {
        brick.alive = false;
        combo = Math.min(combo + 1, COMBO_MAX);
        let gain = 50 + (combo - 1) * 15 + (brick.maxHp - 1) * 20;
        gain *= 1 + 0.2 * buffLv('combo');                 // 连击大师
        if (edgeBoost) gain *= 2;                          // 贴边奖励：得分 ×2
        const added = addScore(gain);
        addFloatText(brick.x + brick.w / 2, brick.y + brick.h / 2,
            '+' + added + (edgeBoost ? ' ×2' : ''),
            edgeBoost ? '#7cf7b0' : combo >= COMBO_FIRE ? '#ffd43b' : '#dbe7ff',
            edgeBoost || combo >= COMBO_FIRE ? 17 : 14);
        if (combo >= COMBO_FIRE) addFloatText(hx, hy - 18, 'COMBO ×' + combo, '#ffd43b', 15);
        spawnBrickParticles(brick);
        maybeDropPowerup(brick);
        shake = Math.max(shake, combo >= COMBO_GOLD ? 5 : 3);
    }

    // TNT 爆炸：波及半径内砖块全部摧毁，TNT 之间连锁引爆
    function explodeAt(tntBrick) {
        const queue = [tntBrick];
        while (queue.length) {
            const b = queue.shift();
            const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
            spawnExplosion(cx, cy);
            shake = Math.max(shake, 16);
            flashAlpha = Math.max(flashAlpha, 0.25);
            SFX.boom();
            for (const other of bricks) {
                if (!other.alive) continue;
                const ox = other.x + other.w / 2, oy = other.y + other.h / 2;
                if (Math.hypot(ox - cx, oy - cy) <= TNT_RADIUS) {
                    if (other.tnt) {
                        other.alive = false;               // 先标记，入队后自行引爆
                        queue.push(other);
                    } else {
                        killBrick(other, ox, oy);
                    }
                }
            }
        }
    }

    function spawnExplosion(x, y) {
        // 冲击波圆环
        rings.push({ x, y, r: 8, maxR: TNT_RADIUS + 25, life: 0.35, maxLife: 0.35 });
        // 爆炸粒子
        for (let i = 0; i < 30; i++) {
            const a = rand(0, Math.PI * 2);
            const sp = rand(80, 460);
            particles.push({
                kind: i % 4 === 0 ? 'star' : i % 3 === 0 ? 'spark' : 'square',
                x, y,
                vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                size: rand(3, 8),
                color: ['#ff6b35', '#ffd93d', '#ff5566', '#ffffff'][randInt(0, 3)],
                angle: a, spin: rand(-14, 14),
                life: rand(0.35, 0.95), maxLife: 0.95,
            });
        }
    }

    function hitBrick(brick, ball) {
        brick.hp--;
        brick.hitFlash = 0.12;
        if (brick.hp <= 0) {
            killBrick(brick, ball.x, ball.y);
            if (brick.tnt) {
                explodeAt(brick);                          // TNT：爆炸 + 连锁
            } else {
                SFX.brick(brick.maxHp, combo);             // 音高随连击递进
            }
        } else {
            addScore(edgeBoost ? 20 : 10);
            SFX.brick(brick.hp, combo);
        }
        // 反弹：按重叠量决定方向
        const cx = brick.x + brick.w / 2, cy = brick.y + brick.h / 2;
        const dx = ball.x - cx, dy = ball.y - cy;
        const overlapX = (brick.w / 2 + ball.r) - Math.abs(dx);
        const overlapY = (brick.h / 2 + ball.r) - Math.abs(dy);
        if (overlapX < overlapY) {
            ball.vx = -ball.vx;
            ball.x = dx > 0 ? brick.x + brick.w + ball.r : brick.x - ball.r;
        } else {
            ball.vy = -ball.vy;
            ball.y = dy > 0 ? brick.y + brick.h + ball.r : brick.y - ball.r;
        }
        // 防止水平死循环
        const sp = Math.hypot(ball.vx, ball.vy);
        if (Math.abs(ball.vy) < sp * 0.22) {
            ball.vy = (ball.vy >= 0 ? 1 : -1) * sp * 0.22;
            ball.vx = Math.sign(ball.vx || 1) * Math.sqrt(Math.max(sp * sp - ball.vy * ball.vy, 0));
        }
    }

    function updateBalls(dt) {
        // 球速修正：连击滚雪球提速
        const comboMul = 1 + Math.min(combo, COMBO_MAX) * COMBO_SPEED_STEP;
        const moveMul = comboMul;
        for (let bi = balls.length - 1; bi >= 0; bi--) {
            const ball = balls[bi];
            if (ball.vx === 0 && ball.vy === 0) continue;   // 待发射

            // 子步进防穿模
            const dist = Math.hypot(ball.vx, ball.vy) * dt * moveMul;
            const steps = Math.max(1, Math.ceil(dist / 5));
            const sdt = dt * moveMul / steps;
            let dead = false;

            for (let s = 0; s < steps && !dead; s++) {
                ball.x += ball.vx * sdt;
                ball.y += ball.vy * sdt;

                // 墙壁（双人模式顶部无墙，由 P2 球拍防守）
                if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = -ball.vx; SFX.wall(); }
                if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -ball.vx; SFX.wall(); }
                if (!twoPlayer && ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = -ball.vy; SFX.wall(); }

                // 落底（双人模式下顶部漏球同样失守）
                if (ball.y - ball.r > H) { dead = true; break; }
                if (twoPlayer && ball.y + ball.r < 0) { dead = true; break; }

                // 球拍
                if (ball.vy > 0 &&
                    ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h + 6 &&
                    ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
                    const hit = clamp((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
                    const sp = Math.hypot(ball.vx, ball.vy);
                    const angle = hit * 60 * Math.PI / 180;
                    ball.vx = sp * Math.sin(angle);
                    ball.vy = -sp * Math.cos(angle);
                    ball.y = paddle.y - ball.r - 0.5;
                    if (Math.abs(hit) > edgeZone()) {
                        // 贴边击球：连击 +1，破砖得分 ×2（持续到下次拍心击球）
                        combo = Math.min(combo + 1, COMBO_MAX);
                        edgeBoost = true;
                        paddleFlash = 0.3;
                        shake = Math.max(shake, 4);
                        addFloatText(ball.x, paddle.y - 30, '贴边! ×2', '#7cf7b0', 16);
                        SFX.edge();
                    } else {
                        edgeBoost = false;
                        combo = 0;                       // 拍心击球重置连击
                        SFX.paddle();
                    }
                }

                // 顶部球拍（双人模式 P2，←/-> 控制）
                if (twoPlayer && ball.vy < 0 &&
                    ball.y - ball.r <= paddle2.y + paddle2.h && ball.y + ball.r >= paddle2.y - 6 &&
                    ball.x >= paddle2.x - ball.r && ball.x <= paddle2.x + paddle2.w + ball.r) {
                    const hit = clamp((ball.x - (paddle2.x + paddle2.w / 2)) / (paddle2.w / 2), -1, 1);
                    const sp = Math.hypot(ball.vx, ball.vy);
                    const angle = hit * 60 * Math.PI / 180;
                    ball.vx = sp * Math.sin(angle);
                    ball.vy = sp * Math.cos(angle);          // 反射向下
                    ball.y = paddle2.y + paddle2.h + ball.r + 0.5;
                    if (Math.abs(hit) > edgeZone()) {
                        combo = Math.min(combo + 1, COMBO_MAX);
                        edgeBoost = true;
                        addFloatText(ball.x, paddle2.y + paddle2.h + 30, '贴边! ×2', '#7cf7b0', 16);
                        SFX.edge();
                    } else {
                        edgeBoost = false;
                        combo = 0;
                        SFX.paddle();
                    }
                }

                // 砖块
                for (const brick of bricks) {
                    if (!brick.alive) continue;
                    const nx = clamp(ball.x, brick.x, brick.x + brick.w);
                    const ny = clamp(ball.y, brick.y, brick.y + brick.h);
                    const ddx = ball.x - nx, ddy = ball.y - ny;
                    if (ddx * ddx + ddy * ddy < ball.r * ball.r) {
                        hitBrick(brick, ball);
                        break;
                    }
                }
            }
            if (dead) {
                // 多球时掉一颗不扣命
                balls.splice(bi, 1);
                if (balls.length === 0) { loseLife(); return; }
                continue;
            }

            // 轨迹
            ball.trail.push({ x: ball.x, y: ball.y });
            if (ball.trail.length > 10) ball.trail.shift();
        }
    }

    // ================= 左右分屏双人对战 =================
    function createDuelSide(index) {
        const x0 = index * (W / 2);
        const areaW = W / 2;
        const cols = 7, rows = 5, gap = 4;
        const bw = (areaW - 48 - (cols - 1) * gap) / cols;
        const sideBricks = [];
        for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
                const tnt = level === 3 && row === col - 1;
                sideBricks.push({
                    x: x0 + 24 + col * (bw + gap),
                    y: 92 + row * (BRICK_HEIGHT + gap),
                    w: bw, h: BRICK_HEIGHT,
                    hp: 1, maxHp: 1, alive: true, hitFlash: 0, tnt,
                });
            }
        }
        const p = { x: x0 + (areaW - 92) / 2, y: H - 48, w: 92, h: PADDLE_HEIGHT };
        return {
            index, x0, areaW, paddle: p, bricks: sideBricks,
            ball: { x: p.x + p.w / 2, y: p.y - BALL_RADIUS - 1, r: BALL_RADIUS, vx: 0, vy: 0, trail: [] },
            lives: MAX_LIVES, score: 0,
        };
    }

    function initDuel() {
        duel = { sides: [createDuelSide(0), createDuelSide(1)], winner: 0 };
        state = 'serving';
        stage.classList.remove('playing');
    }

    function resetDuelBall(side) {
        side.ball.x = side.paddle.x + side.paddle.w / 2;
        side.ball.y = side.paddle.y - side.ball.r - 1;
        side.ball.vx = 0;
        side.ball.vy = 0;
        side.ball.trail = [];
    }

    function launchDuel() {
        if (!duel) return;
        for (const side of duel.sides) {
            if (side.ball.vx === 0 && side.ball.vy === 0) {
                const speed = ballSpeedFor(level);
                const a = rand(55, 125) * Math.PI / 180;
                side.ball.vx = Math.cos(a) * speed;
                side.ball.vy = -Math.sin(a) * speed;
            }
        }
        state = 'playing';
        stage.classList.add('playing');
        SFX.launch();
    }

    function finishDuel(winnerIndex, reason) {
        if (!duel || duel.winner) return;
        duel.winner = winnerIndex;
        state = 'gameover';
        stage.classList.remove('playing');
        SFX.clear();
        const winner = duel.sides[winnerIndex - 1];
        modalTitle.textContent = `🏆 玩家 ${winnerIndex} 获胜`;
        modalSub.textContent = reason;
        modalScore.textContent = `${duel.sides[0].score} : ${duel.sides[1].score}`;
        modalLevel.textContent = level;
        modalHighScore.textContent = winner.score;
        btnRestart.textContent = '再战一局';
        modalBox.classList.remove('record');
        modalOverlay.classList.add('active');
    }

    function hitDuelBrick(side, brick, ball) {
        brick.alive = false;
        side.score += brick.tnt ? 100 : 50;
        spawnBrickParticles(brick);
        if (brick.tnt) {
            const cx = brick.x + brick.w / 2, cy = brick.y + brick.h / 2;
            spawnExplosion(cx, cy);
            shake = Math.max(shake, 12);
            SFX.boom();
            for (const b of side.bricks) {
                if (!b.alive) continue;
                const bx = b.x + b.w / 2, by = b.y + b.h / 2;
                if (Math.hypot(bx - cx, by - cy) <= TNT_RADIUS) {
                    b.alive = false;
                    side.score += 50;
                    spawnBrickParticles(b);
                }
            }
        } else SFX.brick(1, 0);
        if (side.bricks.every(b => !b.alive)) finishDuel(side.index + 1, '率先清空全部砖块');
    }

    function updateDuelBall(side, dt) {
        const ball = side.ball;
        if (ball.vx === 0 && ball.vy === 0) {
            ball.x = side.paddle.x + side.paddle.w / 2;
            ball.y = side.paddle.y - ball.r - 1;
            return;
        }
        const steps = Math.max(1, Math.ceil(Math.hypot(ball.vx, ball.vy) * dt / 5));
        const sdt = dt / steps;
        for (let s = 0; s < steps; s++) {
            ball.x += ball.vx * sdt;
            ball.y += ball.vy * sdt;
            const left = side.x0, right = side.x0 + side.areaW;
            if (ball.x - ball.r < left) { ball.x = left + ball.r; ball.vx = Math.abs(ball.vx); }
            if (ball.x + ball.r > right) { ball.x = right - ball.r; ball.vx = -Math.abs(ball.vx); }
            if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }
            if (ball.y - ball.r > H) {
                side.lives--;
                if (side.lives <= 0) {
                    finishDuel(side.index === 0 ? 2 : 1, `玩家 ${side.index + 1} 生命耗尽`);
                } else {
                    resetDuelBall(side);
                    const speed = ballSpeedFor(level);
                    const a = rand(55, 125) * Math.PI / 180;
                    side.ball.vx = Math.cos(a) * speed;
                    side.ball.vy = -Math.sin(a) * speed;
                }
                return;
            }
            const p = side.paddle;
            if (ball.vy > 0 && ball.y + ball.r >= p.y && ball.y - ball.r <= p.y + p.h + 5 &&
                ball.x >= p.x - ball.r && ball.x <= p.x + p.w + ball.r) {
                const hit = clamp((ball.x - (p.x + p.w / 2)) / (p.w / 2), -1, 1);
                const sp = Math.hypot(ball.vx, ball.vy);
                const angle = hit * 60 * Math.PI / 180;
                ball.vx = sp * Math.sin(angle);
                ball.vy = -sp * Math.cos(angle);
                ball.y = p.y - ball.r - 0.5;
                SFX.paddle();
            }
            for (const brick of side.bricks) {
                if (!brick.alive) continue;
                const nx = clamp(ball.x, brick.x, brick.x + brick.w);
                const ny = clamp(ball.y, brick.y, brick.y + brick.h);
                const dx = ball.x - nx, dy = ball.y - ny;
                if (dx * dx + dy * dy < ball.r * ball.r) {
                    hitDuelBrick(side, brick, ball);
                    ball.vy = -ball.vy;
                    break;
                }
            }
        }
        ball.trail.push({ x: ball.x, y: ball.y });
        if (ball.trail.length > 8) ball.trail.shift();
    }

    function updateDuel(dt) {
        if (!duel || state === 'gameover') return;
        const [p1, p2] = duel.sides;
        if (keys.p1l) p1.paddle.x -= PADDLE_SPEED * dt;
        if (keys.p1r) p1.paddle.x += PADDLE_SPEED * dt;
        if (keys.p2l) p2.paddle.x -= PADDLE_SPEED * dt;
        if (keys.p2r) p2.paddle.x += PADDLE_SPEED * dt;
        p1.paddle.x = clamp(p1.paddle.x, p1.x0, p1.x0 + p1.areaW - p1.paddle.w);
        p2.paddle.x = clamp(p2.paddle.x, p2.x0, p2.x0 + p2.areaW - p2.paddle.w);
        if (state === 'playing') {
            updateDuelBall(p1, dt);
            updateDuelBall(p2, dt);
        } else {
            updateDuelBall(p1, 0);
            updateDuelBall(p2, 0);
        }
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i]; p.life -= dt;
            if (p.life <= 0) { particles.splice(i, 1); continue; }
            p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt;
        }
        for (let i = rings.length - 1; i >= 0; i--) {
            const r = rings[i]; r.life -= dt;
            if (r.life <= 0) { rings.splice(i, 1); continue; }
            r.r += (r.maxR - r.r) * Math.min(1, dt * 12);
        }
        shake = Math.max(0, shake - dt * 40);
    }

    // ================= 主更新 =================
    function update(dt) {
        if (twoPlayer) { updateDuel(dt); return; }
        // 拍宽缓动
        paddle.w += (paddle.targetW - paddle.w) * Math.min(1, dt * 10);

        // 键盘移动（P1: A/D + 鼠标 底拍；P2: ←/-> 顶拍；单人时方向键也控制底拍）
        if (state === 'playing' || state === 'serving') {
            // 冻结道具只锁住接到道具的底部球拍；双人模式的 P2 仍可救场
            if (freezeTimer <= 0) {
                if (keys.p1l || (!twoPlayer && keys.p2l)) paddle.x -= PADDLE_SPEED * dt;
                if (keys.p1r || (!twoPlayer && keys.p2r)) paddle.x += PADDLE_SPEED * dt;
            }
            if (twoPlayer) {
                if (keys.p2l) paddle2.x -= PADDLE_SPEED * dt;
                if (keys.p2r) paddle2.x += PADDLE_SPEED * dt;
            }
        }
        paddle.x = clamp(paddle.x, 0, W - paddle.w);
        if (twoPlayer) {
            paddle2.w = basePaddleWidth();
            paddle2.x = clamp(paddle2.x, 0, W - paddle2.w);
        }

        // 待发射球跟随球拍
        for (const b of balls) {
            if (b.vx === 0 && b.vy === 0) {
                b.x = paddle.x + paddle.w / 2;
                b.y = paddle.y - b.r - 1;
            }
        }

        // 道具计时
        if (expandTimer > 0) {
            expandTimer -= dt;
            if (expandTimer <= 0 && shrinkTimer <= 0) paddle.targetW = basePaddleWidth();
        }
        if (shrinkTimer > 0) {
            shrinkTimer -= dt;
            if (shrinkTimer <= 0 && expandTimer <= 0) paddle.targetW = basePaddleWidth();
        }
        if (freezeTimer > 0) freezeTimer -= dt;
        if (paddleFlash > 0) paddleFlash -= dt;

        if (state === 'playing') {
            updateBalls(dt);

            // 接道具（磁力：范围内的道具被吸向球拍）
            const magnetR = 45 * buffLv('magnet');
            const pcx = paddle.x + paddle.w / 2, pcy = paddle.y + paddle.h / 2;
            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i];
                p.y += POWERUP_SPEED * dt;
                p.t += dt;
                if (magnetR > 0) {
                    const d = Math.hypot(p.x - pcx, p.y - pcy);
                    if (d < magnetR && d > 1) {
                        p.x += (pcx - p.x) * Math.min(1, dt * 4);
                        p.y += (pcy - p.y) * Math.min(1, dt * 2);
                    }
                }
                if (p.y - POWERUP_SIZE / 2 > H) { powerups.splice(i, 1); continue; }
                if (p.y + POWERUP_SIZE / 2 >= paddle.y && p.y - POWERUP_SIZE / 2 <= paddle.y + paddle.h &&
                    p.x >= paddle.x - POWERUP_SIZE / 2 && p.x <= paddle.x + paddle.w + POWERUP_SIZE / 2) {
                    applyPowerup(p.type);
                    powerups.splice(i, 1);
                }
            }

            // 通关判定 -> 进入抽卡阶段
            if (state === 'playing' && bricks.every(b => !b.alive)) {
                const bonus = addScore(300 + (level - 1) * 50);
                addFloatText(W / 2, H / 2 - 40, '通关奖励 +' + bonus, '#ffd43b', 20);
                SFX.clear();
                SFX.jackpot();
                spawnConfetti(110);
                spawnStarBurst(W / 2, H / 2, 10);
                state = 'levelclear';
                levelClearTimer = 1.6;
                balls = [];
                powerups = [];
            }
        } else if (state === 'levelclear') {
            levelClearTimer -= dt;
            if (levelClearTimer <= 0) openDraft();
        }

        // 爆炸冲击波圆环
        for (let i = rings.length - 1; i >= 0; i--) {
            const r = rings[i];
            r.life -= dt;
            if (r.life <= 0) { rings.splice(i, 1); continue; }
            r.r += (r.maxR - r.r) * Math.min(1, dt * 12);
        }
        // 粒子
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.life -= dt;
            if (p.life <= 0) { particles.splice(i, 1); continue; }
            p.x += p.vx * dt; p.y += p.vy * dt;
            p.vy += (p.kind === 'confetti' ? 70 : 600) * dt;
            p.angle = (p.angle || 0) + (p.spin || 0) * dt;
        }
        // 浮动文字
        for (let i = floatTexts.length - 1; i >= 0; i--) {
            const f = floatTexts[i];
            f.life -= dt * 1.1;
            f.y -= 36 * dt;
            if (f.life <= 0) floatTexts.splice(i, 1);
        }
        // 砖块受击闪白
        for (const b of bricks) if (b.hitFlash > 0) b.hitFlash -= dt;

        shake = Math.max(0, shake - dt * 40);
        if (flashAlpha > 0) {
            flashAlpha -= dt * 1.6;
            if (flashAlpha < 0) flashAlpha = 0;
        }
    }

    // ================= 绘制 =================
    function roundRect(c, x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        c.beginPath();
        c.moveTo(x + r, y);
        c.arcTo(x + w, y, x + w, y + h, r);
        c.arcTo(x + w, y + h, x, y + h, r);
        c.arcTo(x, y + h, x, y, r);
        c.arcTo(x, y, x + w, y, r);
        c.closePath();
    }

    function drawTntBrick(b) {
        const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 170 + b.x * 0.05);
        ctx.save();
        ctx.shadowColor = '#ff6b35';
        ctx.shadowBlur = 6 + 10 * pulse;
        const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
        g.addColorStop(0, '#ff8c42');
        g.addColorStop(0.55, '#e0522e');
        g.addColorStop(1, '#8e2418');
        ctx.fillStyle = g;
        roundRect(ctx, b.x, b.y, b.w, b.h, 4);
        ctx.fill();
        ctx.restore();

        // 斜纹警示带
        ctx.save();
        roundRect(ctx, b.x, b.y, b.w, b.h, 4);
        ctx.clip();
        ctx.strokeStyle = 'rgba(0,0,0,0.22)';
        ctx.lineWidth = 5;
        for (let sx = b.x - b.h; sx < b.x + b.w + b.h; sx += 11) {
            ctx.beginPath();
            ctx.moveTo(sx, b.y + b.h + 3);
            ctx.lineTo(sx + b.h, b.y - 3);
            ctx.stroke();
        }
        ctx.restore();

        // TNT 字样
        ctx.fillStyle = `rgba(255,255,255,${0.85 + 0.15 * pulse})`;
        ctx.font = 'bold 11px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('TNT', b.x + b.w / 2, b.y + b.h / 2 + 1);

        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 1;
        roundRect(ctx, b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1, 4);
        ctx.stroke();
    }

    function drawBricks() {
        for (const b of bricks) {
            if (!b.alive) continue;
            if (b.tnt) { drawTntBrick(b); continue; }
            const tier = TIER_COLORS[clamp(b.maxHp, 1, 4)];
            const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
            g.addColorStop(0, tier.top);
            g.addColorStop(1, tier.bottom);
            ctx.fillStyle = g;
            roundRect(ctx, b.x, b.y, b.w, b.h, 4);
            ctx.fill();

            // 顶部高光
            ctx.fillStyle = 'rgba(255,255,255,0.22)';
            roundRect(ctx, b.x + 2, b.y + 2, b.w - 4, b.h * 0.32, 3);
            ctx.fill();

            // 行次微调明暗，避免整片均一
            ctx.fillStyle = ROW_TINT[Math.floor(b.y - AREA_TOP) / (BRICK_HEIGHT + BRICK_GAP) % ROW_TINT.length | 0] || 'transparent';
            roundRect(ctx, b.x, b.y, b.w, b.h, 4);
            ctx.fill();

            // 受击闪白
            if (b.hitFlash > 0) {
                ctx.fillStyle = `rgba(255,255,255,${b.hitFlash * 5})`;
                roundRect(ctx, b.x, b.y, b.w, b.h, 4);
                ctx.fill();
            }

            // 多血砖：底部血量点
            if (b.maxHp > 1) {
                const pipW = 7, gap = 3;
                const totalW = b.hp * pipW + (b.hp - 1) * gap;
                let px = b.x + (b.w - totalW) / 2;
                for (let i = 0; i < b.hp; i++) {
                    ctx.fillStyle = 'rgba(255,255,255,0.85)';
                    roundRect(ctx, px, b.y + b.h - 6, pipW, 2.5, 1.25);
                    ctx.fill();
                    px += pipW + gap;
                }
            }

            ctx.strokeStyle = 'rgba(0,0,0,0.25)';
            ctx.lineWidth = 1;
            roundRect(ctx, b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1, 4);
            ctx.stroke();
        }
    }

    function drawPaddle() {
        const { x, y, w, h } = paddle;
        ctx.save();
        ctx.shadowColor = freezeTimer > 0 ? '#b8ecff' : shrinkTimer > 0 ? '#ff5566' : '#38d9ff';
        ctx.shadowBlur = 14;
        const g = ctx.createLinearGradient(x, y, x, y + h);
        g.addColorStop(0, freezeTimer > 0 ? '#e7f8ff' : shrinkTimer > 0 ? '#ffc2c8' : '#aee9ff');
        g.addColorStop(0.45, freezeTimer > 0 ? '#74c0fc' : shrinkTimer > 0 ? '#ff7785' : '#38d9ff');
        g.addColorStop(1, freezeTimer > 0 ? '#2878b5' : shrinkTimer > 0 ? '#a82834' : '#1470a8');
        ctx.fillStyle = g;
        roundRect(ctx, x, y, w, h, h / 2);
        ctx.fill();
        ctx.restore();

        // 中心能量条：贴边奖励激活时变金色 ×2
        ctx.fillStyle = edgeBoost ? 'rgba(255, 217, 61, 0.95)' : 'rgba(255,255,255,0.35)';
        roundRect(ctx, x + w / 2 - 12, y + h / 2 - 1.5, 24, 3, 1.5);
        ctx.fill();
        // 贴边提示区（两侧边缘，随「贴边专家」扩大）
        const ez = Math.max(4, w * (1 - edgeZone()));
        ctx.fillStyle = edgeBoost ? 'rgba(124, 247, 176, 0.55)' : 'rgba(124, 247, 176, 0.18)';
        roundRect(ctx, x + 1, y + 2, ez - 2, h - 4, 3);
        ctx.fill();
        roundRect(ctx, x + w - ez + 1, y + 2, ez - 2, h - 4, 3);
        ctx.fill();

        // 冻结覆盖层：冰蓝外壳和雪花标记
        if (freezeTimer > 0) {
            ctx.fillStyle = 'rgba(180,235,255,0.55)';
            roundRect(ctx, x - 2, y - 2, w + 4, h + 4, h / 2 + 2);
            ctx.fill();
            ctx.fillStyle = '#e7f8ff';
            ctx.font = 'bold 13px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`❄ ${freezeTimer.toFixed(1)}s`, x + w / 2, y - 6);
        }

        // 贴边击球闪白
        if (paddleFlash > 0) {
            ctx.fillStyle = `rgba(255,255,255,${paddleFlash * 2})`;
            roundRect(ctx, x, y, w, h, h / 2);
            ctx.fill();
        }

        // 宽度变化倒计时
        const widthTimer = expandTimer > 0 ? expandTimer : shrinkTimer;
        if (widthTimer > 0) {
            ctx.fillStyle = shrinkTimer > 0 ? '#ff7785' : 'rgba(77,171,247,0.9)';
            ctx.font = 'bold 11px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(Math.ceil(widthTimer) + 's', x + w / 2, y - 5);
        }
        if (edgeBoost) {
            ctx.fillStyle = '#7cf7b0';
            ctx.font = 'bold 11px "Segoe UI", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('×2', x - 4, y + h / 2 + 3);
        }
    }

    function ballSkin() {
        // 连击越高，球越“热”：默认金黄 -> 火焰 -> 炽蓝 -> 全金
        if (combo >= COMBO_GOLD) return { trail: [255, 230, 120], glow: '#ffe98a', c0: '#ffffff', c1: '#fff3b0', c2: '#ffb020', hot: true };
        if (combo >= COMBO_HOT)  return { trail: [56, 217, 255], glow: '#38d9ff', c0: '#ffffff', c1: '#9be7ff', c2: '#1e8fd4', hot: true };
        if (combo >= COMBO_FIRE) return { trail: [255, 140, 60], glow: '#ff8c3c', c0: '#fff4e0', c1: '#ffb36b', c2: '#e05a1a', hot: true };
        return { trail: [255, 217, 61], glow: '#ffd93d', c0: '#ffffff', c1: '#ffe98a', c2: '#f0a824', hot: false };
    }

    function drawSecondPaddle() {
        if (!twoPlayer) return;
        const { x, y, w, h } = paddle2;
        ctx.save();
        ctx.shadowColor = freezeTimer > 0 ? '#b8ecff' : '#b197fc';
        ctx.shadowBlur = 14;
        const g = ctx.createLinearGradient(x, y, x, y + h);
        if (freezeTimer > 0) {
            g.addColorStop(0, '#e7f8ff'); g.addColorStop(0.5, '#74c0fc'); g.addColorStop(1, '#2878b5');
        } else {
            g.addColorStop(0, '#e5dbff'); g.addColorStop(0.5, '#b197fc'); g.addColorStop(1, '#7048b8');
        }
        ctx.fillStyle = g;
        roundRect(ctx, x, y, w, h, h / 2);
        ctx.fill();
        ctx.restore();
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        roundRect(ctx, x + w / 2 - 12, y + h / 2 - 1.5, 24, 3, 1.5);
        ctx.fill();
        ctx.fillStyle = '#b197fc';
        ctx.font = 'bold 10px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText('P2  ← / →', x + w / 2, y - 4);
    }

    function drawBalls() {
        const skin = ballSkin();
        for (const b of balls) {
            // 拖尾（高连击更长更亮）
            const boost = skin.hot ? 1.5 : 1;
            for (let i = 0; i < b.trail.length; i++) {
                const t = b.trail[i];
                const a = (i / b.trail.length) * 0.35 * boost;
                const [tr, tg, tb] = skin.trail;
                ctx.fillStyle = `rgba(${tr},${tg},${tb},${Math.min(a, 0.55)})`;
                ctx.beginPath();
                ctx.arc(t.x, t.y, b.r * (0.3 + 0.6 * i / b.trail.length) * boost, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.save();
            ctx.shadowColor = skin.glow;
            ctx.shadowBlur = 16 + (skin.hot ? 8 : 0);
            const g = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.35, b.r * 0.1, b.x, b.y, b.r);
            g.addColorStop(0, skin.c0);
            g.addColorStop(0.45, skin.c1);
            g.addColorStop(1, skin.c2);
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    function drawPowerups() {
        for (const p of powerups) {
            const info = POWER_TYPES[p.type];
            const bob = Math.sin(p.t * 6) * 2;
            ctx.save();
            ctx.translate(p.x, p.y + bob);
            ctx.shadowColor = info.color;
            ctx.shadowBlur = 12;
            // 负面道具：深色底 + 警示描边
            ctx.fillStyle = info.bad ? 'rgba(26,8,12,0.95)' : 'rgba(10,16,28,0.92)';
            roundRect(ctx, -POWERUP_SIZE / 2, -POWERUP_SIZE / 2, POWERUP_SIZE, POWERUP_SIZE, 8);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = info.color;
            ctx.lineWidth = 2;
            if (info.bad) ctx.setLineDash([5, 3]);
            roundRect(ctx, -POWERUP_SIZE / 2, -POWERUP_SIZE / 2, POWERUP_SIZE, POWERUP_SIZE, 8);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = info.color;
            ctx.font = `bold ${info.bad ? 17 : 15}px "Segoe UI", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(info.label, 0, 1);
            ctx.restore();
        }
    }

    function drawRings() {
        for (const r of rings) {
            const a = clamp(r.life / r.maxLife, 0, 1);
            ctx.strokeStyle = `rgba(255,140,60,${a * 0.8})`;
            ctx.lineWidth = 3 + 4 * a;
            ctx.beginPath();
            ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
            ctx.stroke();
            ctx.strokeStyle = `rgba(255,217,61,${a * 0.5})`;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(r.x, r.y, r.r * 0.72, 0, Math.PI * 2);
            ctx.stroke();
        }
    }

    function drawParticles() {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (const p of particles) {
            ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
            ctx.fillStyle = p.color;
            ctx.strokeStyle = p.color;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle || 0);
            if (p.kind === 'star') {
                ctx.beginPath();
                for (let i = 0; i < 8; i++) {
                    const a = i * Math.PI / 4;
                    const r = i % 2 === 0 ? p.size : p.size * 0.28;
                    const x = Math.cos(a) * r, y = Math.sin(a) * r;
                    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
                }
                ctx.closePath(); ctx.fill();
            } else if (p.kind === 'spark') {
                ctx.lineWidth = Math.max(1, p.size * 0.35);
                ctx.beginPath(); ctx.moveTo(-p.size * 2.2, 0); ctx.lineTo(p.size * 2.2, 0); ctx.stroke();
            } else if (p.kind === 'confetti') {
                ctx.globalCompositeOperation = 'source-over';
                ctx.fillRect(-p.size / 2, -p.size * 0.25, p.size, p.size * 0.5);
                ctx.globalCompositeOperation = 'lighter';
            } else {
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            }
            ctx.restore();
        }
        ctx.restore();
    }

    function drawFloatTexts() {
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (const f of floatTexts) {
            ctx.globalAlpha = clamp(f.life, 0, 1);
            ctx.font = `bold ${f.size}px "Segoe UI", "PingFang SC", sans-serif`;
            ctx.fillStyle = f.color;
            ctx.fillText(f.text, f.x, f.y);
        }
        ctx.globalAlpha = 1;
    }

    function drawOverlayText(title, sub, alpha = 1) {
        ctx.fillStyle = `rgba(4,8,16,${0.62 * alpha})`;
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#dbe7ff';
        ctx.font = '800 42px "Segoe UI", "PingFang SC", sans-serif';
        ctx.fillText(title, W / 2, H / 2 - 26);
        if (sub) {
            ctx.fillStyle = '#6c82a5';
            ctx.font = '16px "Segoe UI", "PingFang SC", sans-serif';
            ctx.fillText(sub, W / 2, H / 2 + 22);
        }
        ctx.globalAlpha = 1;
    }

    function drawDuelPaddle(p, color) {
        ctx.save();
        ctx.shadowColor = color;
        ctx.shadowBlur = 12;
        ctx.fillStyle = color;
        roundRect(ctx, p.x, p.y, p.w, p.h, p.h / 2);
        ctx.fill();
        ctx.restore();
    }

    function drawDuelBall(ball, color) {
        for (let i = 0; i < ball.trail.length; i++) {
            const t = ball.trail[i];
            ctx.globalAlpha = (i / ball.trail.length) * 0.35;
            ctx.fillStyle = color;
            ctx.beginPath(); ctx.arc(t.x, t.y, ball.r * 0.7, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = 14;
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }

    function drawDuel() {
        if (!duel) return;
        ctx.save();
        // 分屏中线
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.fillRect(W / 2 - 1, 0, 2, H);
        const colors = ['#38d9ff', '#b197fc'];
        for (const side of duel.sides) {
            const color = colors[side.index];
            ctx.fillStyle = side.index === 0 ? 'rgba(56,217,255,0.025)' : 'rgba(177,151,252,0.025)';
            ctx.fillRect(side.x0, 0, side.areaW, H);
            ctx.font = 'bold 16px "Segoe UI", "PingFang SC", sans-serif';
            ctx.textBaseline = 'top';
            ctx.textAlign = side.index === 0 ? 'left' : 'right';
            ctx.fillStyle = color;
            const tx = side.index === 0 ? side.x0 + 14 : side.x0 + side.areaW - 14;
            ctx.fillText(`P${side.index + 1}  ${side.index === 0 ? 'A / D' : '← / →'}`, tx, 12);
            ctx.font = '13px "Segoe UI", sans-serif';
            ctx.fillText(`❤️ ${side.lives}   分数 ${side.score}`, tx, 37);
            for (const b of side.bricks) {
                if (!b.alive) continue;
                if (b.tnt) drawTntBrick(b);
                else {
                    ctx.fillStyle = color;
                    roundRect(ctx, b.x, b.y, b.w, b.h, 4); ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.18)';
                    roundRect(ctx, b.x + 2, b.y + 2, b.w - 4, b.h * 0.3, 3); ctx.fill();
                }
            }
            drawDuelPaddle(side.paddle, color);
            drawDuelBall(side.ball, color);
        }
        if (state === 'serving') {
            ctx.fillStyle = 'rgba(4,8,16,0.55)'; ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#fff'; ctx.font = 'bold 26px "Segoe UI", "PingFang SC", sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('双人分屏对战', W / 2, H / 2 - 20);
            ctx.fillStyle = '#8ea3c6'; ctx.font = '15px "Segoe UI", "PingFang SC", sans-serif';
            ctx.fillText('空格发球 · 先清砖或耗尽对手生命者获胜', W / 2, H / 2 + 22);
        }
        ctx.restore();
    }

    function drawFullscreenHud() {
        if (document.fullscreenElement !== stage || state === 'menu' || twoPlayer) return;
        ctx.save();
        ctx.fillStyle = 'rgba(7,11,20,0.78)';
        roundRect(ctx, W / 2 - 165, H - 40, 330, 28, 14);
        ctx.fill();
        ctx.font = 'bold 12px "Segoe UI", "PingFang SC", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#38d9ff';
        ctx.fillText(`关卡 ${level}`, W / 2 - 115, H - 26);
        ctx.fillStyle = '#dbe7ff';
        ctx.fillText(`分数 ${score}`, W / 2 - 30, H - 26);
        ctx.fillStyle = '#ff6b81';
        ctx.fillText(`生命 ${'♥'.repeat(lives)}${'♡'.repeat(MAX_LIVES - lives)}`, W / 2 + 65, H - 26);
        ctx.fillStyle = '#6c82a5';
        ctx.fillText('F / Esc 退出', W / 2 + 135, H - 26);
        ctx.restore();
    }

    function drawBuffBar() {
        const entries = Object.entries(buffs);
        if (!entries.length) return;
        ctx.save();
        ctx.font = 'bold 12px "Segoe UI", "PingFang SC", sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        let x = 12;
        const y = 10, h = 24;
        for (const [id, lv] of entries) {
            const def = BUFF_DEFS[id];
            const label = `${def.icon}${def.name} Lv.${lv}`;
            const w = ctx.measureText(label).width + 18;
            ctx.fillStyle = 'rgba(13,21,36,0.85)';
            roundRect(ctx, x, y, w, h, 12);
            ctx.fill();
            ctx.strokeStyle = def.color;
            ctx.lineWidth = 1.5;
            roundRect(ctx, x, y, w, h, 12);
            ctx.stroke();
            ctx.fillStyle = '#dbe7ff';
            ctx.fillText(label, x + 9, y + h / 2 + 1);
            x += w + 6;
        }
        ctx.restore();
    }

    function draw() {
        ctx.save();
        // 屏幕震动
        if (shake > 0) {
            ctx.translate(rand(-shake, shake), rand(-shake, shake));
        }

        // 背景
        const bg = ctx.createRadialGradient(W / 2, H * 0.3, 60, W / 2, H * 0.5, 620);
        bg.addColorStop(0, '#101c31');
        bg.addColorStop(1, '#060a12');
        ctx.fillStyle = bg;
        ctx.fillRect(-20, -20, W + 40, H + 40);

        // 网格底纹
        ctx.strokeStyle = 'rgba(56,217,255,0.045)';
        ctx.lineWidth = 1;
        for (let gx = 0; gx <= W; gx += 50) {
            ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
        }
        for (let gy = 0; gy <= H; gy += 50) {
            ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
        }

        if (twoPlayer) {
            drawDuel();
            ctx.restore();
            return;
        }

        // 死亡线
        ctx.strokeStyle = 'rgba(255,107,129,0.18)';
        ctx.setLineDash([8, 8]);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, H - 4);
        ctx.lineTo(W, H - 4);
        ctx.stroke();
        ctx.setLineDash([]);

        if (state !== 'menu') {
            // 顶端：已持有强化条
            drawBuffBar();
            drawBricks();
            drawPowerups();
            drawParticles();
            drawRings();
            drawPaddle();
            drawSecondPaddle();
            drawBalls();
            drawFloatTexts();

            // 剩余砖块 & 状态指示
            const alive = bricks.filter(b => b.alive).length;
            ctx.font = '12px "Segoe UI", "PingFang SC", sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            ctx.fillStyle = 'rgba(108,130,165,0.8)';
            ctx.fillText(`剩余砖块 ${alive}`, 14, H - 12);
            const status = [];
            if (shrinkTimer > 0) status.push({ text: `✂ 变窄 ${Math.ceil(shrinkTimer)}s`, color: '#ff7785' });
            if (freezeTimer > 0) status.push({ text: `❄ 冻结 ${freezeTimer.toFixed(1)}s`, color: '#74c0fc' });
            ctx.textAlign = 'right';
            status.forEach((s, i) => {
                ctx.fillStyle = s.color;
                ctx.fillText(s.text, W - 14 - i * 130, H - 12);
            });
            // 连击表
            if (combo >= COMBO_FIRE) {
                ctx.fillStyle = combo >= COMBO_GOLD ? '#ffe98a' : '#ffd43b';
                ctx.font = `bold ${14 + Math.min(combo, COMBO_GOLD)}px "Segoe UI", sans-serif`;
                ctx.textBaseline = 'top';
                ctx.fillText(`COMBO ×${combo}`, W - 14, 12);
            }
            // 秘籍开启标识
            if (infiniteLives) {
                ctx.fillStyle = '#ff9f43';
                ctx.font = 'bold 12px "Segoe UI", sans-serif';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'top';
                ctx.fillText('♾ KOB MODE', W - 14, 34);
            }
            if (level === 3) {
                ctx.fillStyle = '#ff9f43';
                ctx.font = 'bold 12px "Segoe UI", "PingFang SC", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('🧨 TNT 连锁挑战 · 周围砖块只掉负面技能', W / 2, 42);
            }
        }

        // 连击满级：全屏金光氛围
        if (combo >= COMBO_GOLD) {
            const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.85);
            vg.addColorStop(0, 'rgba(255,217,61,0)');
            vg.addColorStop(1, `rgba(255,217,61,${0.05 + 0.04 * Math.sin(performance.now() / 150)})`);
            ctx.fillStyle = vg;
            ctx.fillRect(0, 0, W, H);
        }

        // 状态覆盖层（主菜单由 HTML 开始面板呈现）
        if (state === 'serving') {
            ctx.textAlign = 'center';
            ctx.fillStyle = 'rgba(255,255,255,0.28)';
            ctx.font = '15px "Segoe UI", "PingFang SC", sans-serif';
            ctx.textBaseline = 'bottom';
            ctx.fillText(twoPlayer ? `第 ${level} 关 · P1 A/D · P2 ←/-> · 空格发射`
                                   : `第 ${level} 关 · 按空格 或 点击 发射`, W / 2, H - 16);
        } else if (state === 'paused') {
            drawOverlayText('⏸ 已暂停', '按 P 继续 · 按 Q 保存并返回主菜单');
        } else if (state === 'levelclear') {
            const a = clamp(levelClearTimer / 0.3, 0, 1);
            drawOverlayText(`第 ${level} 关 通过!`, '✨ 即将选择强化卡', a);
        }

        drawFullscreenHud();

        // 掉命红闪
        if (flashAlpha > 0) {
            ctx.fillStyle = `rgba(255,60,80,${flashAlpha * 0.32})`;
            ctx.fillRect(-20, -20, W + 40, H + 40);
        }

        ctx.restore();
    }

    // ================= 游戏循环 =================
    function loop(ts) {
        const dt = Math.min((ts - lastTime) / 1000, 0.033);
        lastTime = ts;
        if (state !== 'paused' && state !== 'gameover' && !devOpen) update(dt);
        draw();
        animId = requestAnimationFrame(loop);
    }

    // ================= 输入 =================
    function primaryAction() {
        ensureAudio();
        if (state === 'serving') {
            if (twoPlayer) { launchDuel(); return; }
            launchBalls();
            state = 'playing';
            stage.classList.add('playing');
        } else if (state === 'paused') {
            if (twoPlayer && duel) {
                state = duel.sides.some(s => s.ball.vx || s.ball.vy) ? 'playing' : 'serving';
            } else {
                state = balls.some(b => b.vx || b.vy) ? 'playing' : 'serving';
            }
            lastTime = performance.now();
        }
    }

    function pointerToCanvasX(clientX) {
        const rect = canvas.getBoundingClientRect();
        return (clientX - rect.left) * (canvas.width / rect.width);
    }
    function movePaddleTo(clientX) {
        if (state !== 'playing' && state !== 'serving' && state !== 'menu') return;
        if (twoPlayer && duel) {
            const p = duel.sides[0].paddle;
            p.x = clamp(pointerToCanvasX(clientX) - p.w / 2, 0, W / 2 - p.w);
            return;
        }
        if (freezeTimer > 0) return;
        paddle.x = clamp(pointerToCanvasX(clientX) - paddle.w / 2, 0, W - paddle.w);
    }

    window.addEventListener('keydown', (e) => {
        const k = e.key;
        // 输入框内不触发游戏快捷键与秘籍
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        // KOB 秘籍序列（再输入一次 KOB 也可关闭）
        if (/^[a-zA-Z]$/.test(k)) {
            devBuffer = (devBuffer + k.toLowerCase()).slice(-8);
            if (devBuffer.endsWith('kob')) {
                devBuffer = '';
                toggleDevPanel();
                return;
            }
        }
        // 秘籍弹窗打开时：仅 Esc 可关闭，其余按键屏蔽
        if (devOpen) {
            e.preventDefault();
            if (k === 'Escape') closeDevPanel();
            return;
        }
        if (k === 'a' || k === 'A') { keys.p1l = true; e.preventDefault(); }
        else if (k === 'd' || k === 'D') { keys.p1r = true; e.preventDefault(); }
        else if (k === 'ArrowLeft') { keys.p2l = true; e.preventDefault(); }
        else if (k === 'ArrowRight') { keys.p2r = true; e.preventDefault(); }
        else if (k === ' ' || k === 'Spacebar') { e.preventDefault(); primaryAction(); }
        else if (k === 'p' || k === 'P' || k === 'Escape') {
            if (state === 'playing' || state === 'serving') { state = 'paused'; stage.classList.remove('playing'); }
            else if (state === 'paused') primaryAction();
        }
        else if (k === 'q' || k === 'Q') {
            if (state === 'paused' || state === 'serving' || state === 'playing') {
                // 返回主菜单；进度保留在最近一次三关检查点
                currentSlot = 0;
                showStartPanel();
            }
        }
        else if (k === 'm' || k === 'M') toggleMute();
        else if (k === 'f' || k === 'F') toggleFullscreen();
        else if (k === 'r' || k === 'R') { if (state === 'gameover') restart(); }
    });
    window.addEventListener('keyup', (e) => {
        const k = e.key;
        if (k === 'a' || k === 'A') keys.p1l = false;
        else if (k === 'd' || k === 'D') keys.p1r = false;
        else if (k === 'ArrowLeft') keys.p2l = false;
        else if (k === 'ArrowRight') keys.p2r = false;
    });
    window.addEventListener('blur', () => {
        keys.p1l = keys.p1r = keys.p2l = keys.p2r = false;
        if (state === 'playing') { state = 'paused'; stage.classList.remove('playing'); }
    });

    canvas.addEventListener('mousemove', (e) => movePaddleTo(e.clientX));
    canvas.addEventListener('click', () => primaryAction());
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (state === 'playing') return;
        primaryAction();
        if (e.touches[0]) movePaddleTo(e.touches[0].clientX);
    }, { passive: false });
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (e.touches[0]) movePaddleTo(e.touches[0].clientX);
    }, { passive: false });

    function toggleMute() {
        muted = !muted;
        btnMute.textContent = muted ? '🔇' : '🔊';
        if (muted) bgmAudio.pause();
        else playSelectedBgm();
    }
    async function toggleFullscreen() {
        try {
            if (!document.fullscreenElement) await stage.requestFullscreen();
            else await document.exitFullscreen();
        } catch (_) {}
    }
    btnMute.addEventListener('click', (e) => { e.stopPropagation(); toggleMute(); });
    btnFullscreen.addEventListener('click', (e) => { e.stopPropagation(); toggleFullscreen(); });
    document.addEventListener('fullscreenchange', () => {
        btnFullscreen.textContent = document.fullscreenElement ? '⛶' : '⛶';
        btnFullscreen.title = document.fullscreenElement ? '退出全屏 (F)' : '全屏 (F)';
    });
    btnRestart.addEventListener('click', restart);
    document.getElementById('btn-menu').addEventListener('click', () => {
        currentSlot = 0;
        showStartPanel();
    });
    btnNew.addEventListener('click', () => { ensureAudio(); showSlotPicker('new'); });
    btnLoad.addEventListener('click', () => { ensureAudio(); showSlotPicker('load'); });
    btnBack.addEventListener('click', () => {
        startButtons.classList.remove('hidden');
        slotList.classList.add('hidden');
        btnBack.classList.add('hidden');
    });
    function selectMenuMode(isTwoPlayer) {
        menuTwoPlayer = isTwoPlayer;
        mode1p.classList.toggle('active', !isTwoPlayer);
        mode2p.classList.toggle('active', isTwoPlayer);
    }
    mode1p.addEventListener('click', () => selectMenuMode(false));
    mode2p.addEventListener('click', () => selectMenuMode(true));
    document.querySelectorAll('.music-tab').forEach(tab => tab.addEventListener('click', () => {
        bgmStyle = tab.dataset.style;
        const currentInStyle = BGM_TRACKS[bgmStyle].some(t => t.id === bgmTrackId);
        if (!currentInStyle) bgmTrackId = BGM_TRACKS[bgmStyle][0].id;
        localStorage.setItem('brickKingBgmStyle', bgmStyle);
        renderMusicPicker();
    }));
    musicVolumeEl.addEventListener('input', () => {
        bgmVolume = parseInt(musicVolumeEl.value, 10);
        bgmAudio.volume = bgmVolume / 100;
        musicVolumeLabel.textContent = bgmVolume + '%';
        localStorage.setItem('brickKingBgmVolume', String(bgmVolume));
        if (bgmVolume > 0 && bgmAudio.paused && !muted) playSelectedBgm();
    });

    // 开发者秘籍事件
    devClose.addEventListener('click', closeDevPanel);
    devPanel.addEventListener('click', (e) => {
        if (e.target === devPanel) closeDevPanel();     // 点击遮罩关闭
    });
    devLevelJump.addEventListener('click', () => devJumpLevel(parseInt(devLevelInput.value, 10)));
    devLevelInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') devJumpLevel(parseInt(devLevelInput.value, 10));
    });
    devHalf.addEventListener('click', devKillHalfBricks);
    devInfinite.addEventListener('change', () => {
        infiniteLives = devInfinite.checked;
        if (infiniteLives) {
            lives = MAX_LIVES;
            updateLivesUI();
        }
    });
    devReset.addEventListener('click', () => {
        infiniteLives = false;
        devInfinite.checked = false;
        addFloatText(W / 2, H / 2, '秘籍效果已关闭', '#ff8fa3', 16);
    });

    // ================= 开发者秘籍（输入 KOB 呼出） =================
    function openDevPanel() {
        devOpen = true;
        devLevelInput.value = level;
        devInfinite.checked = infiniteLives;
        renderDevBuffs();
        devPanel.classList.add('active');
        SFX.power();
    }
    function closeDevPanel() {
        devOpen = false;
        devPanel.classList.remove('active');
    }
    function toggleDevPanel() {
        devOpen ? closeDevPanel() : openDevPanel();
    }

    function renderDevBuffs() {
        devBuffsEl.innerHTML = '';
        for (const [id, def] of Object.entries(BUFF_DEFS)) {
            const row = document.createElement('div');
            row.className = 'dev-buff-row';
            const name = document.createElement('span');
            name.className = 'dev-buff-name';
            name.textContent = def.icon + ' ' + def.name;
            name.title = def.desc(1);
            const stepper = document.createElement('span');
            stepper.className = 'dev-stepper';
            const minus = document.createElement('button');
            minus.textContent = '−';
            const lvEl = document.createElement('span');
            lvEl.className = 'dev-lv';
            lvEl.textContent = 'Lv.' + buffLv(id);
            const plus = document.createElement('button');
            plus.textContent = '+';
            minus.addEventListener('click', () => devAdjustBuff(id, -1));
            plus.addEventListener('click', () => devAdjustBuff(id, 1));
            stepper.append(minus, lvEl, plus);
            row.append(name, stepper);
            devBuffsEl.appendChild(row);
        }
    }

    function devAdjustBuff(id, delta) {
        const cur = buffLv(id);
        const next = clamp(cur + delta, 0, MAX_BUFF_LV);
        if (next === cur) return;
        if (next === 0) delete buffs[id]; else buffs[id] = next;
        // 即时生效
        if (id === 'wide') paddle.targetW = currentTargetW();
        if (id === 'ball') for (const b of balls) b.r = ballRadiusNow();
        renderDevBuffs();
    }

    function devJumpLevel(n) {
        n = clamp(Math.floor(n) || 1, 1, 999);
        if (state === 'menu' || state === 'gameover') {
            startGame(currentSlot || 1, null);           // 秘籍可直接开一局用于测试
        }
        level = n;
        updateLevelUI();
        bricks = createBricks(level);
        powerups = []; particles = []; floatTexts = []; rings = [];
        expandTimer = shrinkTimer = freezeTimer = 0;
        edgeBoost = false;
        paddle.targetW = basePaddleWidth();
        resetBallsToPaddle();
        state = 'serving';
        stage.classList.remove('playing');
        closeDevPanel();
    }

    function devKillHalfBricks() {
        const alive = bricks.filter(b => b.alive);
        const killCount = Math.ceil(alive.length / 2);
        // 部分洗牌：前 killCount 个位置与随机位置交换后处决
        for (let i = 0; i < killCount; i++) {
            const j = randInt(i, alive.length - 1);
            [alive[i], alive[j]] = [alive[j], alive[i]];
            alive[i].alive = false;                     // 静默消失：不计分、不掉道具、TNT 不炸
            spawnBrickParticles(alive[i]);
        }
        shake = Math.max(shake, 10);
        SFX.boom();
    }

    // ================= 生命周期 =================
    function startGame(slot, saveData) {
        playSelectedBgm();
        currentSlot = slot;
        twoPlayer = saveData && typeof saveData.twoPlayer === 'boolean' ? saveData.twoPlayer : menuTwoPlayer;
        if (saveData) {
            level = clamp(saveData.level || 1, 1, 9999);
            score = saveData.score || 0;
            lives = clamp(saveData.lives || MAX_LIVES, 1, LIVES_CAP);
        } else {
            level = 1;
            score = 0;
            lives = MAX_LIVES;
        }
        buffs = {};
        if (saveData && saveData.buffs) {
            for (const [k, v] of Object.entries(saveData.buffs)) {
                if (BUFF_DEFS[k] && typeof v === 'number' && v > 0) buffs[k] = Math.min(v, MAX_BUFF_LV);
            }
        }
        combo = 0;
        edgeBoost = false;
        expandTimer = shrinkTimer = freezeTimer = 0;
        paddleFlash = 0;
        paddle.w = paddle.targetW = basePaddleWidth();
        paddle.x = (W - paddle.w) / 2;
        paddle2.w = basePaddleWidth();
        paddle2.x = (W - paddle2.w) / 2;
        bricks = createBricks(level);
        powerups = []; particles = []; floatTexts = [];
        rings = [];
        if (twoPlayer) initDuel();
        else { duel = null; resetBallsToPaddle(); }
        hideStartPanel();
        draftPanel.classList.remove('active');
        modalOverlay.classList.remove('active');
        modalBox.classList.remove('record');
        updateScoreUI(); updateLivesUI(); updateLevelUI();
        state = 'serving';
        lastTime = performance.now();
        if (!twoPlayer) saveGame();    // 对战为独立比赛，不覆盖单人关卡存档
    }
    function restart() {
        const slot = currentSlot || 1;
        if (twoPlayer) {
            startGame(slot, { level, score: 0, lives: MAX_LIVES, buffs: {}, twoPlayer: true });
        } else {
            const checkpoint = readSlot(slot);
            startGame(slot, checkpoint);         // 单人死亡后从最近的三关检查点继续
        }
        window.focus();
    }

    function boot() {
        updateScoreUI(); updateLivesUI(); updateLevelUI();
        menuHighScoreEl.textContent = highScore;
        renderMusicPicker();
        lastTime = performance.now();
        animId = requestAnimationFrame(loop);
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
})();
</script>
</body>
</html>
